<!-- update_summary.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="text-warning text-center mb-4"><i class="bi bi-pencil-square"></i> Update Discharge Summary</h3>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <form id="updateForm" class="card shadow-sm p-4 bg-white">
          <div class="mb-3">
            <label class="form-label">Summary ID</label>
            <input type="number" class="form-control" id="summaryID" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Diagnosis</label>
            <textarea class="form-control" id="diagnosis" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Treatment</label>
            <textarea class="form-control" id="treatment" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Follow-up</label>
            <textarea class="form-control" id="followUp" required></textarea>
          </div>
          <button type="submit" class="btn btn-warning text-dark w-100">Update</button>
          <div id="message" class="text-success mt-3 text-center fw-semibold"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("updateForm").addEventListener("submit", function (e) {
      e.preventDefault();

      fetch("backend/update_discharge.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          summaryID: document.getElementById("summaryID").value,
          diagnosis: document.getElementById("diagnosis").value,
          treatment: document.getElementById("treatment").value,
          followUp: document.getElementById("followUp").value,
        }),
      })
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("message").innerText = data.message;
        });
    });
  </script>
</body>
</html>

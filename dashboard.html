<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Capital Health Centre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="text-end">
      <button id="logout" class="btn btn-outline-danger">
        <i class="bi bi-box-arrow-left"></i> Logout
      </button>
    </div>

    <h3 class="text-center mb-4">Welcome, <span id="username"></span> (<span id="role"></span>)</h3>

    <div class="row justify-content-center">
      <div class="col-md-5 mb-4">
        <a href="add_summary.html" class="btn btn-primary w-100 p-4 shadow-sm">
          <i class="bi bi-file-earmark-plus me-2"></i>Add Discharge Summary
        </a>
      </div>
      <div class="col-md-5 mb-4">
        <a href="view_summary.html" class="btn btn-success w-100 p-4 shadow-sm">
          <i class="bi bi-file-earmark-text me-2"></i>View Discharge Summary
        </a>
      </div>
      <div class="col-md-5 mb-4">
        <a href="update_summary.html" class="btn btn-warning w-100 p-4 shadow-sm text-dark">
          <i class="bi bi-pencil-square me-2"></i>Update Discharge Summary
        </a>
      </div>
      <div class="col-md-5 mb-4">
        <a href="attach_report.html" class="btn btn-secondary w-100 p-4 shadow-sm">
          <i class="bi bi-paperclip me-2"></i>Attach Lab Report
        </a>
      </div>
    </div>
  </div>

  <script>
    // Load user info
    const username = localStorage.getItem("username");
    const role = localStorage.getItem("role");

    if (!username || !role) {
      alert("You are not logged in.");
      window.location.href = "login.html";
    } else {
      document.getElementById("username").innerText = username;
      document.getElementById("role").innerText = role;
    }

    // Logout
    document.getElementById("logout").addEventListener("click", function () {
      localStorage.clear();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>

<!-- view_summary.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Discharge Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="mb-4 text-success text-center"><i class="bi bi-file-earmark-text"></i> View Discharge Summary</h3>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <form id="viewForm" class="card shadow-sm p-4 bg-white">
          <div class="mb-3">
            <label class="form-label">Patient ID</label>
            <input type="number" id="patientID" class="form-control" required />
          </div>
          <button class="btn btn-success w-100" type="submit">Fetch Summary</button>
        </form>
      </div>
    </div>

    <div class="mt-4" id="results"></div>
  </div>

  <script>
    document.getElementById("viewForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const id = document.getElementById("patientID").value;

      fetch("backend/get_discharge.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ patientID: id }),
      })
        .then((res) => res.json())
        .then((data) => {
          const results = document.getElementById("results");
          results.innerHTML = "";

          if (data.success && data.data.length > 0) {
            data.data.forEach((item) => {
              results.innerHTML += `
                <div class="card mt-3 shadow-sm">
                  <div class="card-body">
                    <h5>Summary ID: ${item.SummaryID}</h5>
                    <p><strong>Diagnosis:</strong> ${item.Diagnosis}</p>
                    <p><strong>Treatment:</strong> ${item.Treatment}</p>
                    <p><strong>Follow-Up:</strong> ${item.FollowUp}</p>
                    <p class="text-muted"><i class="bi bi-clock"></i> ${item.CreatedAt}</p>
                  </div>
                </div>`;
            });
          } else {
            results.innerHTML = `<div class="alert alert-warning mt-3">No summaries found.</div>`;
          }
        });
    });
  </script>
</body>
</html>

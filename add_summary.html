<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Discharge Summary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
      margin: 0;
    }

    .container {
      background: #ffffff;
      max-width: 600px;
      margin: auto;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #007b83;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
      font-size: 14px;
    }

    button {
      width: 100%;
      background: #007b83;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #005f66;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
      color: #d00000;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Add Discharge Summary</h2>

  <form id="dischargeForm">
    <label for="patientID">Patient ID</label>
    <input type="number" id="patientID" required>

    <label for="diagnosis">Diagnosis</label>
    <textarea id="diagnosis" rows="3" required></textarea>

    <label for="treatment">Treatment</label>
    <textarea id="treatment" rows="3" required></textarea>

    <label for="followUp">Follow-Up Instructions</label>
    <textarea id="followUp" rows="3" required></textarea>

    <button type="submit">Submit Summary</button>
  </form>

  <p id="message"></p>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("dischargeForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const data = {
        patientID: document.getElementById("patientID").value,
        diagnosis: document.getElementById("diagnosis").value,
        treatment: document.getElementById("treatment").value,
        followUp: document.getElementById("followUp").value
      };

      fetch("http://localhost/CapitalHealth/backend/insert_discharge.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
        console.log("✅ Server Response:", result);
        const message = document.getElementById("message");
        message.innerText = result.message;
        message.style.color = result.success ? "green" : "red";
      })
      .catch(error => {
        console.error("❌ Fetch failed:", error);
        document.getElementById("message").innerText = "❌ Something went wrong.";
      });
    });
  });
</script>

</body>
</html>
